<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>404 — Page Not Found | Fahmid Ferdous</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#080f1c;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;overflow:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none}
.orb1{width:400px;height:400px;background:rgba(200,144,42,.1);top:-100px;right:-100px;animation:drift 12s ease-in-out infinite alternate}
.orb2{width:300px;height:300px;background:rgba(30,60,140,.2);bottom:-50px;left:-50px;animation:drift 16s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(30px,30px)}}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto}
.num{font-family:'Syne',sans-serif;font-size:clamp(7rem,20vw,11rem);font-weight:800;line-height:1;background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(200,144,42,.4));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.5rem}
.icon{font-size:3rem;margin-bottom:1.2rem}
h1{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:700;margin-bottom:.8rem;color:#fff}
p{font-size:.95rem;color:rgba(255,255,255,.5);line-height:1.75;margin-bottom:2.5rem}
.btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.85rem 2rem;border-radius:100px;font-size:.85rem;font-weight:600;text-decoration:none;transition:transform .2s,box-shadow .2s;font-family:'Inter',sans-serif}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:#c8902a;color:#fff;box-shadow:0 4px 20px rgba(200,144,42,.35)}
.btn-primary:hover{box-shadow:0 8px 28px rgba(200,144,42,.45)}
.btn-ghost{border:1.5px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7)}
.btn-ghost:hover{border-color:#c8902a;color:#c8902a}
.divider{width:40px;height:2px;background:#c8902a;margin:1.5rem auto}
.links{display:flex;gap:1.5rem;justify-content:center;margin-top:2rem}
.links a{font-size:.75rem;color:rgba(255,255,255,.3);text-decoration:none;letter-spacing:.08em;text-transform:uppercase;transition:color .2s}
.links a:hover{color:#c8902a}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="wrap">
  <div class="num">404</div>
  <div class="icon">🔍</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or may have moved. Let's get you back to Fahmid's portfolio.</p>
  <div class="divider"></div>
  <div class="btns">
    <a href="/" class="btn btn-primary">&#8592; Back to Portfolio</a>
    <a href="mailto:fahmidferdous@gmail.com" class="btn btn-ghost">✉ Send Email</a>
  </div>
  <div class="links">
    <a href="/#about">About</a>
    <a href="/#experience">Experience</a>
    <a href="/#contact">Contact</a>
    <a href="https://www.linkedin.com/in/fahmidferdous" target="_blank">LinkedIn</a>
  </div>
</div>
</body>
</html>
